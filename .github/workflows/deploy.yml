name: Verification apres deploiement
# Livraison continue (meme chaine pour les deux environnements) :
#   push sur develop -> Vercel construit et deploie le projet exam-taskapp-preprod (pre-production)
#   push sur main    -> Vercel construit et deploie le projet exam-taskapp (production)
# Ce workflow attend que l'URL publique serve exactement ce commit (champ "version" de /api/health),
# puis lance le test de fumee de bout en bout. Un echec rend le commit rouge et envoie un e-mail :
# on revient en arriere avec "vercel rollback" (ou "Instant Rollback" dans le tableau de bord).
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preprod' }}
      url: ${{ github.ref_name == 'main' && 'https://exam-taskapp.vercel.app' || 'https://exam-taskapp-preprod.vercel.app' }}
    env:
      URL: ${{ github.ref_name == 'main' && 'https://exam-taskapp.vercel.app' || 'https://exam-taskapp-preprod.vercel.app' }}
    steps:
      - uses: actions/checkout@v5
      - name: Attendre que Vercel serve ce commit
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            got=$(curl -s --max-time 10 "$URL/api/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$got" = "$want" ]; then echo "Version $want en ligne sur $URL"; exit 0; fi
            echo "Essai $i : en ligne = ${got:-?}, attendu = $want"; sleep 10
          done
          echo "::error::Le commit $want n'est pas en ligne apres 10 minutes"; exit 1
      - name: Test de fumee (23 verifications)
        run: bash scripts/smoke-test.sh "$URL" | tee -a "$GITHUB_STEP_SUMMARY"

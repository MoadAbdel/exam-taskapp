name: Deploiement
# Livraison continue. La meme chaine sert aux deux environnements :
#   push sur develop -> pre-production (projet Vercel exam-taskapp-preprod)
#   push sur main    -> production     (projet Vercel exam-taskapp)
# Etapes : CI complete -> deploiement Vercel -> test de fumee de bout en bout sur l'URL publique.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preprod' }}
      url: ${{ steps.vars.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Choix de l'environnement
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "project=${{ secrets.VERCEL_PROJECT_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "url=https://exam-taskapp.vercel.app" >> "$GITHUB_OUTPUT"
          else
            echo "project=${{ secrets.VERCEL_PROJECT_ID_PREPROD }}" >> "$GITHUB_OUTPUT"
            echo "url=https://exam-taskapp-preprod.vercel.app" >> "$GITHUB_OUTPUT"
          fi
      - run: npm install --global vercel@latest
      - name: Deploiement Vercel
        env:
          VERCEL_PROJECT_ID: ${{ steps.vars.outputs.project }}
        run: |
          url=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deploiement : $url" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test de fumee sur l'URL publique
        run: bash scripts/smoke-test.sh "${{ steps.vars.outputs.url }}" | tee -a "$GITHUB_STEP_SUMMARY"

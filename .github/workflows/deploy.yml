name: Verification apres deploiement
# Livraison continue (meme chaine pour les deux environnements) :
#   push sur develop -> Vercel construit et deploie le projet exam-taskapp-preprod (pre-production)
#   push sur main    -> Vercel construit et deploie le projet exam-taskapp (production)
# Vercel signale la fin du deploiement a GitHub (evenement deployment_status).
# Ce workflow lance alors le test de fumee de bout en bout sur l'URL publique de l'environnement.
# Un echec rend le commit rouge et envoie un e-mail : on revient en arriere avec "vercel rollback".
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL a tester
        default: https://exam-taskapp.vercel.app

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Choix de l'URL publique
        id: vars
        env:
          ENV_NAME: ${{ github.event.deployment.environment }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          case "$ENV_NAME" in
            *exam-taskapp-preprod*) url=https://exam-taskapp-preprod.vercel.app ;;
            *exam-taskapp*)         url=https://exam-taskapp.vercel.app ;;
            *)                      url="$INPUT_URL" ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Environnement : ${ENV_NAME:-manuel} -> $url" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test de fumee (23 verifications)
        run: bash scripts/smoke-test.sh "${{ steps.vars.outputs.url }}" | tee -a "$GITHUB_STEP_SUMMARY"

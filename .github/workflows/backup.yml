name: Sauvegarde
# Sauvegarde quotidienne de la base de production (l'offre Atlas gratuite n'a pas de sauvegarde automatique).
# mongodump -> archive compressee -> chiffrement AES-256 (gpg) -> artefact GitHub conserve 30 jours.
# Restauration :
#   gpg -d taskapp_prod.archive.gz.gpg > dump.archive.gz
#   mongorestore --uri "$MONGO_URI" --gzip --archive=dump.archive.gz --drop
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI_PROD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Verifier les secrets
        run: test -n "$MONGO_URI" && test -n "$BACKUP_PASSPHRASE" || { echo "::error::Secret manquant"; exit 1; }
      - name: Installer les outils MongoDB
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.13.0.tgz -O tools.tgz
          tar -xzf tools.tgz && echo "$PWD/$(ls -d mongodb-database-tools-*/)bin" >> "$GITHUB_PATH"
      - name: Export et chiffrement
        run: |
          mongodump --uri "$MONGO_URI" --gzip --archive=taskapp_prod.archive.gz
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 taskapp_prod.archive.gz
          ls -l taskapp_prod.archive.gz.gpg | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: sauvegarde-prod-${{ github.run_id }}
          path: taskapp_prod.archive.gz.gpg
          retention-days: 30
